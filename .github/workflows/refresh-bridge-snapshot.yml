name: Refresh Betclic daily odds

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refresh-bridge-snapshot.yml'
      - 'odds_refresh.py'
      - 'snapshot_refresh.py'
      - 'snapshot_resilience.py'
      - 'test_snapshot_refresh.py'
      - 'test_snapshot_resilience.py'
      - 'app.py'
      - 'football_scope.py'
      - 'tennis_competitions.py'
      - 'requirements.txt'

permissions:
  contents: write

concurrency:
  group: betclic-daily-odds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONUNBUFFERED: '1'
      TODAY_FOOTBALL_TIMEOUT: '7'
      TODAY_TENNIS_TIMEOUT: '7'
      TODAY_FOOTBALL_WORKERS: '6'
      TODAY_TENNIS_WORKERS: '6'
      SNAPSHOT_EVENT_WORKERS: '10'
      SNAPSHOT_EVENT_ATTEMPTS: '2'
      SNAPSHOT_DISCOVERY_ATTEMPTS: '2'
      SNAPSHOT_FALLBACK_MAX_AGE_SECONDS: '5400'
      SNAPSHOT_EVENT_GRACE_AFTER_START_SECONDS: '1800'

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest==9.1.1

      - name: Run snapshot unit tests
        if: github.event_name != 'schedule'
        run: python -m pytest -q test_snapshot_refresh.py test_snapshot_resilience.py

      - name: Refresh odds directly from Betclic
        run: python odds_refresh.py

      - name: Validate generated files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          latest = json.loads(Path('snapshots/latest.json').read_text(encoding='utf-8'))
          status = json.loads(Path('snapshots/status.json').read_text(encoding='utf-8'))
          if latest.get('source') != 'direct_betclic':
              raise SystemExit('latest snapshot is not direct_betclic')
          if status.get('ok') is not True:
              raise SystemExit(f"snapshot status is not healthy: {status}")
          for sport in ('football', 'tennis'):
              for event in latest.get('sports', {}).get(sport, {}).get('events', []):
                  if not event.get('id') or not event.get('name'):
                      raise SystemExit(f"malformed event leaked into {sport} snapshot: {event}")
          print(json.dumps(status, ensure_ascii=False))
          PY

      - name: Publish rolling odds snapshot safely
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/betclic-odds
          for file in latest.json status.json; do
            if [ -f "snapshots/$file" ]; then
              cp "snapshots/$file" "/tmp/betclic-odds/$file"
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            remote_sha="$(git rev-parse origin/main)"

            mkdir -p snapshots
            for file in /tmp/betclic-odds/*; do
              [ -e "$file" ] || continue
              cp "$file" snapshots/
            done
            git add -A -- snapshots/latest.json snapshots/status.json
            if git diff --cached --quiet; then
              echo "No odds changes to publish"
              exit 0
            fi

            last_author="$(git log -1 --pretty=%an)"
            last_subject="$(git log -1 --pretty=%s)"
            rolling_snapshot=false
            if [ "$last_author" = "github-actions[bot]" ]; then
              case "$last_subject" in
                "Refresh Betclic live snapshots"|"Refresh Betclic direct odds"|"Refresh Betclic MyCombi")
                  rolling_snapshot=true
                  ;;
              esac
            fi

            if [ "$rolling_snapshot" = true ]; then
              git commit --amend -m "Refresh Betclic live snapshots"
              if git push --force-with-lease=refs/heads/main:"$remote_sha" origin HEAD:main; then
                exit 0
              fi
            else
              git commit -m "Refresh Betclic live snapshots"
              if git push origin HEAD:main; then
                exit 0
              fi
            fi

            echo "Publish raced with another writer; retry $attempt/3"
            sleep $((attempt * 2))
          done

          echo "Could not publish odds snapshot after 3 attempts"
          exit 1

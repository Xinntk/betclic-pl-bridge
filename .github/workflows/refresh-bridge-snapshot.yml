name: Refresh Betclic daily snapshot

on:
  schedule:
    # GitHub Actions' shortest supported cron interval is 5 minutes.
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refresh-bridge-snapshot.yml'

permissions:
  contents: write

concurrency:
  group: betclic-daily-snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Fetch today's Betclic football and tennis markets
        run: |
          python - <<'PY'
          import copy
          import json
          import time
          import urllib.parse
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          BASE = 'https://betclic-pl-bridge.vercel.app'
          WARSAW = ZoneInfo('Europe/Warsaw')
          now = datetime.now(WARSAW)
          today = now.date().isoformat()
          snapshot_path = Path('snapshots/latest.json')

          try:
              previous = json.loads(snapshot_path.read_text(encoding='utf-8'))
          except Exception:
              previous = {}
          previous_is_today = previous.get('date_warsaw') == today

          def get_json(url, timeout=22, attempts=3):
              last_error = None
              for attempt in range(attempts):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={
                              'User-Agent': 'betclic-project-snapshot/2.0',
                              'Accept': 'application/json',
                          },
                      )
                      with urllib.request.urlopen(req, timeout=timeout) as response:
                          return json.loads(response.read().decode('utf-8'))
                  except Exception as exc:
                      last_error = exc
                      if attempt + 1 < attempts:
                          time.sleep(1.5 * (attempt + 1))
              raise last_error

          def previous_sport(name):
              if not previous_is_today:
                  return None
              value = previous.get('sports', {}).get(name)
              return copy.deepcopy(value) if isinstance(value, dict) else None

          def refresh_sport(name, discovery_path):
              old = previous_sport(name)
              discovery_url = BASE + discovery_path
              try:
                  discovery = get_json(discovery_url, timeout=25)
              except Exception as exc:
                  if old is not None:
                      old['stale'] = True
                      old.setdefault('refresh_errors', []).append({
                          'stage': 'discovery',
                          'detail': repr(exc),
                      })
                      return old
                  return {
                      'sport': name,
                      'stale': True,
                      'event_count': 0,
                      'events': [],
                      'stale_event_ids': [],
                      'errors': [{'stage': 'discovery', 'detail': repr(exc)}],
                  }

              summaries = discovery.get('events', [])
              old_events = {}
              if old:
                  for event in old.get('events', []):
                      if event.get('id') is not None:
                          old_events[str(event['id'])] = event

              errors = []
              stale_event_ids = []
              details = [None] * len(summaries)

              def fetch_one(index, summary):
                  event_id = summary.get('id')
                  if event_id is None:
                      return index, summary, None
                  url = f"{BASE}/event/{event_id}?compact=true"
                  try:
                      return index, get_json(url, timeout=22, attempts=2), None
                  except Exception as exc:
                      cached = old_events.get(str(event_id))
                      if cached is not None:
                          return index, cached, {'event_id': event_id, 'detail': repr(exc), 'reused_previous': True}
                      return index, summary, {'event_id': event_id, 'detail': repr(exc), 'reused_previous': False}

              workers = min(8, max(1, len(summaries)))
              with ThreadPoolExecutor(max_workers=workers) as pool:
                  futures = [pool.submit(fetch_one, i, summary) for i, summary in enumerate(summaries)]
                  for future in as_completed(futures):
                      index, event, error = future.result()
                      details[index] = event
                      if error:
                          errors.append({'stage': 'detail', **error})
                          if error['reused_previous']:
                              stale_event_ids.append(error['event_id'])

              details = [event for event in details if event is not None]
              details.sort(key=lambda event: event.get('date_warsaw') or event.get('date') or '')
              discovery_meta = {key: value for key, value in discovery.items() if key != 'events'}

              return {
                  'sport': name,
                  'stale': False,
                  'event_count': len(details),
                  'stale_event_ids': stale_event_ids,
                  'discovery': discovery_meta,
                  'errors': errors,
                  'events': details,
              }

          sports = {
              'football': refresh_sport('football', '/today?sport=football&scope=curated'),
              'tennis': refresh_sport('tennis', '/today?sport=tennis'),
          }

          if all(sport.get('stale') and not sport.get('events') for sport in sports.values()):
              raise RuntimeError('Bridge unavailable and no usable same-day snapshot exists; keeping previous file unchanged')

          out = {
              'schema_version': 2,
              'generated_at_warsaw': datetime.now(WARSAW).isoformat(),
              'date_warsaw': today,
              'bridge': BASE,
              'sports': sports,
          }

          Path('snapshots').mkdir(exist_ok=True)
          snapshot_path.write_text(json.dumps(out, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots/latest.json
          git diff --cached --quiet || git commit -m "Refresh Betclic daily snapshot"
          git push

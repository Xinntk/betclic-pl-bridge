name: Refresh bridge snapshot

on:
  push:
    paths:
      - '.github/bridge-targets.json'
      - '.github/workflows/refresh-bridge-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch current Betclic markets through bridge
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path

          BASE = 'https://betclic-pl-bridge.vercel.app'
          WARSAW = ZoneInfo('Europe/Warsaw')
          today = datetime.now(WARSAW).date().isoformat()
          targets = json.loads(Path('.github/bridge-targets.json').read_text(encoding='utf-8'))

          def get_json(url, timeout=18):
              req = urllib.request.Request(url, headers={'User-Agent': 'betclic-project-snapshot/1.1'})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.loads(r.read().decode('utf-8'))

          def process_target(target):
              q = target['q']
              sport = target['sport']
              item = {'sport': sport, 'q': q, 'matches': [], 'errors': []}
              search_url = f"{BASE}/search?q={urllib.parse.quote(q)}&limit=20"
              try:
                  search = get_json(search_url, timeout=15)
              except Exception as e:
                  item['errors'].append({'stage': 'search', 'detail': repr(e)})
                  return item

              for event in search.get('events', []):
                  date_warsaw = event.get('date_warsaw') or ''
                  if not date_warsaw.startswith(today):
                      continue
                  event_id = event.get('id')
                  if not event_id:
                      continue
                  try:
                      item['matches'].append(get_json(f"{BASE}/event/{event_id}", timeout=20))
                  except Exception as e:
                      item['errors'].append({'stage': 'detail', 'event_id': event_id, 'detail': repr(e)})
              return item

          with ThreadPoolExecutor(max_workers=min(5, max(1, len(targets)))) as pool:
              results = list(pool.map(process_target, targets))

          out = {
              'generated_at_warsaw': datetime.now(WARSAW).isoformat(),
              'date_warsaw': today,
              'bridge': BASE,
              'targets': results,
          }

          Path('snapshots').mkdir(exist_ok=True)
          Path('snapshots/latest.json').write_text(json.dumps(out, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots/latest.json
          git diff --cached --quiet || git commit -m "Refresh Betclic bridge snapshot"
          git push

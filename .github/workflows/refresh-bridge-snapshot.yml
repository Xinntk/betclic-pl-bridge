name: Refresh Betclic daily snapshot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refresh-bridge-snapshot.yml'
      - 'snapshot_refresh.py'
      - 'test_snapshot_refresh.py'
      - 'app.py'
      - 'mycombi.py'
      - 'football_scope.py'
      - 'tennis_competitions.py'
      - 'requirements.txt'
      - 'snapshots/mycombi_requests.json'

permissions:
  contents: write

concurrency:
  group: betclic-daily-snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONUNBUFFERED: '1'
      TODAY_FOOTBALL_TIMEOUT: '7'
      TODAY_TENNIS_TIMEOUT: '7'
      TODAY_FOOTBALL_WORKERS: '6'
      TODAY_TENNIS_WORKERS: '6'
      SNAPSHOT_EVENT_WORKERS: '10'
      SNAPSHOT_MYCOMBI_WORKERS: '6'
      SNAPSHOT_EVENT_ATTEMPTS: '2'
      SNAPSHOT_DISCOVERY_ATTEMPTS: '2'
      SNAPSHOT_MYCOMBI_ATTEMPTS: '2'
      MYCOMBI_REFRESH_SECONDS: '900'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Run snapshot unit tests
        if: github.event_name != 'schedule'
        run: python -m pytest -q test_snapshot_refresh.py

      - name: Refresh directly from Betclic
        run: python snapshot_refresh.py

      - name: Validate generated files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              Path('snapshots/latest.json'),
              Path('snapshots/status.json'),
              Path('snapshots/mycombi.json'),
              Path('snapshots/mycombi_quotes.json'),
          ]
          for path in required:
              data = json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(data, dict):
                  raise SystemExit(f'{path}: expected JSON object')
          status = json.loads(Path('snapshots/status.json').read_text(encoding='utf-8'))
          if status.get('ok') is not True:
              raise SystemExit(f"snapshot status is not healthy: {status}")
          print(json.dumps(status, ensure_ascii=False))
          PY

      - name: Commit refreshed data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- snapshots
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit"
            exit 0
          fi
          git commit -m "Refresh Betclic direct snapshot"
          git pull --rebase origin main
          git push origin main

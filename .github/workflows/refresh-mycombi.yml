name: Refresh Betclic MyCombi

on:
  workflow_dispatch:
  push:
    paths:
      - 'snapshots/mycombi_requests.json'
      - '.github/workflows/refresh-mycombi.yml'
      - 'mycombi_refresh.py'
      - 'snapshot_refresh.py'
      - 'mycombi.py'
      - 'requirements.txt'

permissions:
  contents: write

concurrency:
  group: betclic-mycombi
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PYTHONUNBUFFERED: '1'
      SNAPSHOT_MYCOMBI_ATTEMPTS: '2'
      MYCOMBI_REFRESH_SECONDS: '900'
      MAX_MYCOMBI_INSPECT_REQUESTS: '10'
      MAX_MYCOMBI_QUOTE_REQUESTS: '40'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Refresh requested MyCombi data
        run: python mycombi_refresh.py

      - name: Validate MyCombi outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for name in ('mycombi.json', 'mycombi_quotes.json', 'mycombi_status.json'):
              data = json.loads((Path('snapshots') / name).read_text(encoding='utf-8'))
              if not isinstance(data, dict):
                  raise SystemExit(f'{name}: expected JSON object')
          status = json.loads(Path('snapshots/mycombi_status.json').read_text(encoding='utf-8'))
          if status.get('ok') is not True:
              raise SystemExit(f"MyCombi status is not healthy: {status}")
          print(json.dumps(status, ensure_ascii=False))
          PY

      - name: Commit MyCombi results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- snapshots/mycombi.json snapshots/mycombi_quotes.json snapshots/mycombi_status.json
          if git diff --cached --quiet; then
            echo "No MyCombi changes to commit"
            exit 0
          fi
          git commit -m "Refresh Betclic MyCombi"
          git pull --rebase origin main
          git push origin main
